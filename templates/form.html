<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ contract_title }}</title>
    <style>
        body { font-family: sans-serif; background: #eef2f5; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 600px; }
        h1 { color: #333; margin-bottom: 20px; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; font-size: 14px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .btn-submit { background: #28a745; color: white; padding: 12px; border: none; border-radius: 6px; width: 100%; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background: #218838; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #007bff; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Назад к выбору договоров</a>
        <h1 id="page-title">{{ contract_title }}</h1>
        
        <form action="/generate-pdf" method="post">
            <input type="hidden" name="contract_type" value="{{ contract_type }}">

            <div class="form-group">
                <label>Город заключения:</label>
                <input type="text" name="city" required placeholder="например, Москва">
            </div>

            <div class="form-group">
                <label>Дата заключения:</label>
                <input type="text" name="date" required placeholder="например, 22 августа 2026">
            </div>

            <div class="form-group">
                <label id="label-party1">Сторона 1 (ФИО / Название):</label>
                <input type="text" name="party1_name" required placeholder="Введите данные первой стороны">
            </div>

            <div class="form-group">
                <label id="label-party1-id">ИНН / Паспортные данные Стороны 1:</label>
                <input type="text" name="party1_id" placeholder="Укажите реквизиты">
            </div>

            <div class="form-group">
                <label id="label-party2">Сторона 2 (ФИО / Название):</label>
                <input type="text" name="party2_name" required placeholder="Введите данные второй стороны">
            </div>

            <div class="form-group">
                <label id="label-party2-id">ИНН / Паспортные данные Стороны 2:</label>
                <input type="text" name="party2_id" placeholder="Укажите реквизиты">
            </div>

            <div class="form-group">
                <label id="label-spec1">Предмет договора / Описание:</label>
                <input type="text" name="specific_field_1" required placeholder="Опишите суть сделки">
            </div>

            <div class="form-group">
                <label id="label-spec2">Дополнительные условия:</label>
                <textarea name="specific_field_2" rows="2" placeholder="Особые условия, порядок расторжения..."></textarea>
            </div>

            <div class="form-group">
                <label id="label-price">Сумма / Цена (руб.):</label>
                <input type="text" name="price" required placeholder="0.00">
            </div>

            <div class="form-group">
                <label id="label-deadline">Срок исполнения:</label>
                <input type="text" name="deadline" required placeholder="например, до 31 декабря 2026">
            </div>

            <button type="submit" class="btn-submit">Скачать готовый PDF</button>
        </form>
    </div>

    <script>
        // Динамическая адаптация названий полей под конкретный тип договора
        const type = "{{ contract_type }}";
        
        const p1 = document.getElementById('label-party1');
        const p2 = document.getElementById('label-party2');
        const spec1 = document.getElementById('label-spec1');
        const priceLabel = document.getElementById('label-price');

        if (type === 'rent') {
            p1.innerText = "Арендодатель (ФИО / Компания):";
            p2.innerText = "Арендатор (ФИО / Компания):";
            spec1.innerText = "Адрес и описание арендуемого помещения:";
            priceLabel.innerText = "Ежемесячная арендная плата (руб.):";
        } else if (type === 'employment') {
            p1.innerText = "Работодатель (Компания):";
            p2.innerText = "Работник (ФИО):";
            spec1.innerText = "Должность и трудовые обязанности:";
            priceLabel.innerText = "Заработная плата в месяц (руб.):";
        } else if (type === 'loan') {
            p1.innerText = "Займодавец (Кто дает деньги):";
            p2.innerText = "Заемщик (Кто берет в долг):";
            spec1.innerText = "Цель займа / Условия возврата:";
            priceLabel.innerText = "Сумма займа (руб.):";
        } else if (type === 'sale') {
            p1.innerText = "Продавец:";
            p2.innerText = "Покупатель:";
            spec1.innerText = "Наименование и характеристики товара:";
            priceLabel.innerText = "Стоимость товара (руб.):";
        }
    </script>
</body>
</html>
