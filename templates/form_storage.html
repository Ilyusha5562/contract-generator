<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Договор хранения</title>
    <style>
        body { font-family: sans-serif; background: #eef2f5; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 650px; }
        h1 { color: #333; margin-bottom: 20px; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; font-size: 14px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .btn-submit { background: #28a745; color: white; padding: 12px; border: none; border-radius: 6px; width: 100%; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background: #218838; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #007bff; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Назад к выбору договоров</a>
        <h1>Договор хранения</h1>
        <form action="/generate-pdf" method="post">
            <input type="hidden" name="contract_type" value="storage">
            
            <div class="form-group"><label>Город заключения:</label><input type="text" name="city" placeholder="Москва" required></div>
            <div class="form-group"><label>Дата заключения:</label><input type="text" name="date" placeholder="22 августа 2026" required></div>
            
            <div class="form-group"><label>Хранитель (ФИО / Название компании):</label><input type="text" name="party1_name" placeholder="ООО «Склад Сервис»" required></div>
            <div class="form-group"><label>Реквизиты и адрес Хранителя:</label><input type="text" name="party1_id" placeholder="ИНН, паспорт/реквизиты, адрес" required></div>

            <div class="form-group"><label>Поклажедатель (ФИО / Название компании):</label><input type="text" name="party2_name" placeholder="Иванов Иван Иванович" required></div>
            <div class="form-group"><label>Реквизиты и адрес Поклажедателя:</label><input type="text" name="party2_id" placeholder="ИНН, паспорт/реквизиты, адрес" required></div>

            <div class="form-group"><label>Описание и оценка передаваемого имущества:</label><input type="text" name="specific_field_1" placeholder="Личные вещи в коробках, оценочная стоимость 150000 руб." required></div>
            <div class="form-group"><label>Условия хранения (температура, безопасность):</label><textarea name="specific_field_2" rows="2" placeholder="Сухое отапливаемое помещение, круглосуточная охрана..."></textarea></div>
            <div class="form-group"><label>Ответственность Хранителя за сохранность:</label><input type="text" name="specific_field_3" placeholder="Хранитель несет полную материальную ответственность за утрату и повреждения" required></div>
            
            <div class="form-group"><label>Стоимость услуг хранения (руб.):</label><input type="text" name="price" placeholder="10000" required></div>
            <div class="form-group"><label>Порядок возврата имущества:</label><input type="text" name="specific_field_4" placeholder="Возврат осуществляется по акту приема-передачи по адресу склада" required></div>
            
            <div class="form-group"><label>Срок хранения:</label><input type="text" name="deadline" placeholder="с 1 сентября по 31 декабря 2026 года" required></div>
            
            <button type="submit" class="btn-submit">Скачать PDF</button>
        </form>
    </div>
</body>
</html>
