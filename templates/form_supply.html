<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Договор поставки</title>
    <style>
        body { font-family: sans-serif; background: #eef2f5; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 650px; }
        h1 { color: #333; margin-bottom: 20px; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; font-size: 14px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .btn-submit { background: #28a745; color: white; padding: 12px; border: none; border-radius: 6px; width: 100%; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background: #218838; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #007bff; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Назад к выбору договоров</a>
        <h1>Договор поставки</h1>
        <form action="/generate-pdf" method="post">
            <input type="hidden" name="contract_type" value="supply">
            
            <div class="form-group"><label>Город заключения:</label><input type="text" name="city" placeholder="Москва" required></div>
            <div class="form-group"><label>Дата заключения:</label><input type="text" name="date" placeholder="22 августа 2026" required></div>
            
            <div class="form-group"><label>Поставщик (Название компании / ИП):</label><input type="text" name="party1_name" placeholder="ООО «Торговый Дом»" required></div>
            <div class="form-group"><label>ИНН, Юридический адрес и Банковские реквизиты Поставщика:</label><input type="text" name="party1_id" placeholder="ИНН, адрес, р/с, БИК..." required></div>

            <div class="form-group"><label>Покупатель (Название компании / ИП):</label><input type="text" name="party2_name" placeholder="ООО «Ритейл Групп»" required></div>
            <div class="form-group"><label>ИНН, Юридический адрес и Банковские реквизиты Покупателя:</label><input type="text" name="party2_id" placeholder="ИНН, адрес, р/с, БИК..." required></div>

            <div class="form-group"><label>Ассортимент, характеристики и партии товара:</label><input type="text" name="specific_field_1" placeholder="Строительные материалы согласно спецификации" required></div>
            <div class="form-group"><label>Условия доставки, тара и упаковка:</label><textarea name="specific_field_2" rows="2" placeholder="Доставка силами Поставщика до склада Покупателя..."></textarea></div>
            <div class="form-group"><label>Порядок и сроки приемки товара по качеству/количеству:</label><input type="text" name="specific_field_3" placeholder="Приемка осуществляется в течение 3 рабочих дней..." required></div>
            
            <div class="form-group"><label>Сумма поставки (руб.):</label><input type="text" name="price" placeholder="300000" required></div>
            <div class="form-group"><label>Порядок и сроки оплаты:</label><input type="text" name="specific_field_4" placeholder="50% предоплата, 50% в течение 5 дней после поставки" required></div>
            
            <div class="form-group"><label>График поставки / Срок действия:</label><input type="text" name="deadline" placeholder="Разовая поставка до 30 сентября 2026 года" required></div>
            
            <button type="submit" class="btn-submit">Скачать PDF</button>
        </form>
    </div>
</body>
</html>
