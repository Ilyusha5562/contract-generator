<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Договор строительного подряда</title>
    <style>
        body { font-family: sans-serif; background: #eef2f5; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 650px; }
        h1 { color: #333; margin-bottom: 20px; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; font-size: 14px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .btn-submit { background: #28a745; color: white; padding: 12px; border: none; border-radius: 6px; width: 100%; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background: #218838; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #007bff; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Назад к выбору договоров</a>
        <h1>Договор строительного подряда</h1>
        <form action="/generate-pdf" method="post">
            <input type="hidden" name="contract_type" value="construction">
            
            <div class="form-group"><label>Город заключения:</label><input type="text" name="city" placeholder="Москва" required></div>
            <div class="form-group"><label>Дата заключения:</label><input type="text" name="date" placeholder="22 августа 2026" required></div>
            
            <div class="form-group"><label>Подрядчик (ФИО / Компания / ИП):</label><input type="text" name="party1_name" placeholder="ООО «СтройГрупп»" required></div>
            <div class="form-group"><label>ИНН / Реквизиты и Юридический адрес Подрядчика:</label><input type="text" name="party1_id" placeholder="ИНН, адрес..." required></div>

            <div class="form-group"><label>Заказчик (ФИО / Компания):</label><input type="text" name="party2_name" placeholder="Иванов Иван Иванович" required></div>
            <div class="form-group"><label>ИНН / Паспорт и Адрес Заказчика:</label><input type="text" name="party2_id" placeholder="Паспортные данные, адрес регистрации" required></div>

            <div class="form-group"><label>Точный адрес строительного объекта:</label><input type="text" name="specific_field_3" placeholder="г. Москва, ул. Ленина, д. 10" required></div>
            <div class="form-group"><label>Описание объекта и видов строительных работ:</label><input type="text" name="specific_field_1" placeholder="Капитальный ремонт квартиры..." required></div>
            <div class="form-group"><label>Требования к качеству и материалы (чьи материалы):</label><textarea name="specific_field_2" rows="2" placeholder="Работа из материалов Подрядчика / Заказчика..."></textarea></div>
            
            <div class="form-group"><label>Общая стоимость работ (руб.):</label><input type="text" name="price" placeholder="500000" required></div>
            
            <div class="form-group"><label>Срок начала работ:</label><input type="text" name="specific_field_4" placeholder="1 сентября 2026" required></div>
            <div class="form-group"><label>Срок окончания (сдачи) объекта:</label><input type="text" name="deadline" placeholder="1 декабря 2026" required></div>
            
            <button type="submit" class="btn-submit">Скачать PDF</button>
        </form>
    </div>
</body>
</html>
