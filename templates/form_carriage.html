<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Договор перевозки</title>
    <style>
        body { font-family: sans-serif; background: #eef2f5; margin: 0; padding: 40px; display: flex; justify-content: center; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 650px; }
        h1 { color: #333; margin-bottom: 20px; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; font-size: 14px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .btn-submit { background: #28a745; color: white; padding: 12px; border: none; border-radius: 6px; width: 100%; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background: #218838; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #007bff; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← Назад к выбору договоров</a>
        <h1>Договор перевозки</h1>
        <form action="/generate-pdf" method="post">
            <input type="hidden" name="contract_type" value="carriage">
            
            <div class="form-group"><label>Город заключения:</label><input type="text" name="city" placeholder="Москва" required></div>
            <div class="form-group"><label>Дата заключения:</label><input type="text" name="date" placeholder="22 августа 2026" required></div>
            
            <div class="form-group"><label>Перевозчик (Транспортная компания / Водитель):</label><input type="text" name="party1_name" placeholder="ИП Иванов И.И." required></div>
            <div class="form-group"><label>Реквизиты и адрес Перевозчика:</label><input type="text" name="party1_id" placeholder="ИНН, паспорт/реквизиты, адрес" required></div>

            <div class="form-group"><label>Заказчик перевозки:</label><input type="text" name="party2_name" placeholder="ООО «Логистик Групп»" required></div>
            <div class="form-group"><label>Реквизиты и адрес Заказчика:</label><input type="text" name="party2_id" placeholder="ИНН, реквизиты, юридический адрес" required></div>

            <div class="form-group"><label>Маршрут (Откуда — Куда) и характер груза:</label><input type="text" name="specific_field_1" placeholder="г. Москва — г. Казань, коробки с товаром" required></div>
            <div class="form-group"><label>Характеристики транспортного средства:</label><textarea name="specific_field_2" rows="2" placeholder="Грузовой автомобиль тентованный, гос. номер..."></textarea></div>
            <div class="form-group"><label>Ответственность за сохранность груза:</label><input type="text" name="specific_field_3" placeholder="Перевозчик несет материальную ответственность за утрату и повреждения груза" required></div>
            
            <div class="form-group"><label>Стоимость перевозки (руб.):</label><input type="text" name="price" placeholder="45000" required></div>
            <div class="form-group"><label>Порядок и сроки оплаты:</label><input type="text" name="specific_field_4" placeholder="50% предоплата, 50% после выгрузки в пункте назначения" required></div>
            
            <div class="form-group"><label>Срок доставки:</label><input type="text" name="deadline" placeholder="не позднее 25 августа 2026 года" required></div>
            
            <button type="submit" class="btn-submit">Скачать PDF</button>
        </form>
    </div>
</body>
</html>
